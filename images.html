<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Fundamentals of Rocket Science - Images</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..700;1,6..96,400..700&family=Montserrat:wght@300;400;500;600&family=Yeseva+One&display=swap" rel="stylesheet">
<link href="https://fonts.canfonts.com/css/maharlika" rel="stylesheet">
<style>
:root {
  --bg-color: #ffffff;
  --card-bg: #fefcfc;
  --title-color: #0d0d0d;
  --text-color: #1a1a1a;
  --subtitle-color: #555555;
  --border-color: #e5e7eb;
  --card-hover-border: #16a34a;
  --shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
  --shadow-hover: 0 15px 35px rgba(22, 163, 74, 0.15);
  --rocket-color: #4b5563;
  --science-color: #16a34a;
  --accent-green: #16a34a;
}

[data-theme="dark"] {
  --bg-color: #0b0f17;
  --card-bg: #111827;
  --title-color: #ffffff;
  --text-color: #f3f4f6;
  --subtitle-color: #9ca3af;
  --border-color: #1f2937;
  --card-hover-border: #22c55e;
  --shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
  --shadow-hover: 0 15px 35px rgba(34, 197, 94, 0.2);
  --rocket-color: #9ca3af;
  --science-color: #22c55e;
  --accent-green: #22c55e;
}

/* Base Resets */
*,
*::before,
*::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family: 'Montserrat', sans-serif;
  background-color: var(--bg-color);
  color: var(--text-color);
  line-height: 1.6;
  padding: 3rem 16px;
  display: flex;
  justify-content: center;
  min-height: 100vh;
  transition: background-color 0.3s ease, color 0.3s ease;
}

.container {
  width: 100%;
  max-width: 1200px;
  position: relative;
  animation: pageFadeIn 0.8s ease-out forwards;
}

@keyframes pageFadeIn {
  from { opacity: 0; }
  to { opacity: 1; }
}

/* Theme Toggle Switch */
.theme-toggle-btn {
  position: absolute;
  top: -10px;
  right: 0;
  background: var(--card-bg);
  border: 1px solid var(--border-color);
  color: var(--text-color);
  padding: 8px 16px;
  border-radius: 20px;
  cursor: pointer;
  font-size: 0.85rem;
  font-weight: 500;
  box-shadow: var(--shadow);
  display: flex;
  align-items: center;
  gap: 6px;
  z-index: 10;
  transition: background-color 0.3s ease, border-color 0.3s ease, color 0.3s ease, box-shadow 0.3s ease;
}

.theme-toggle-btn:hover {
  border-color: var(--card-hover-border);
}

/* Header & Title Styling */
header {
  text-align: center;
  margin-top: 1.5rem;
  margin-bottom: 3rem;
}

.book-title {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  color: var(--title-color);
  text-align: center;
}

.font-the {
  font-family: 'Bodoni Moda', 'Bodoni FLF', serif;
  font-size: clamp(28px, 4vw, 41.25px);
  font-weight: 400;
  letter-spacing: 0.25em;
  line-height: 1;
  margin-left: 0.25em;
  margin-bottom: 0.2rem;
}

.font-fundamentals {
  font-family: 'Yeseva One', serif;
  font-size: clamp(36px, 5vw, 57.45px);
  font-weight: 400;
  letter-spacing: 0.04em;
  line-height: 1;
  margin-bottom: 0.15rem;
}

.font-rocket-science {
  font-family: 'Maharlika', 'Bodoni Moda', serif;
  font-size: clamp(28px, 4vw, 41.25px);
  letter-spacing: 0.02em;
  line-height: 1.1;
}

.color-rocket {
  color: var(--rocket-color);
  transition: color 0.3s ease;
}

.color-science {
  color: var(--science-color);
  transition: color 0.3s ease;
}

.subtitle {
  color: var(--subtitle-color);
  font-size: 0.92rem;
  font-weight: 400;
  letter-spacing: 0.03em;
  margin-top: 1.5rem;
  transition: color 0.3s ease;
}

/* Page Section Heading */
.section-header {
  margin-bottom: 2rem;
  text-align: center;
}

.section-header h1 {
  font-size: 1.8rem;
  font-weight: 600;
  margin-bottom: 0.5rem;
}

/* Hero Feature Image */
.hero-wrapper {
  display: flex;
  justify-content: center;
  margin-bottom: 2.5rem;
  width: 100%;
}

.hero-image-card {
  display: inline-block;
  background-color: var(--card-bg);
  border: 2px solid var(--border-color);
  border-radius: 16px;
  padding: 12px;
  box-shadow: var(--shadow);
  cursor: pointer;
  max-width: 100%;
  
  opacity: 0;
  transform: translateY(30px);
  transition: opacity 0.6s ease-out, transform 0.6s ease-out, border-color 0.3s ease, box-shadow 0.3s ease, background-color 0.3s ease;
}

.hero-image-card.reveal-visible {
  opacity: 1;
  transform: translateY(0);
}

.hero-image-card:hover {
  border-color: var(--card-hover-border);
  box-shadow: var(--shadow-hover);
  transform: translateY(-4px);
}

.hero-image-card img {
  display: block;
  max-width: 100%;
  max-height: 500px;
  height: auto;
  border-radius: 10px;
  object-fit: contain;
}

/* Dynamic Grid */
.image-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
  gap: 1.5rem;
  margin-bottom: 3rem;
}

/* Standard Image Cards */
.image-card {
  background-color: var(--card-bg);
  border: 2px solid var(--border-color);
  border-radius: 14px;
  padding: 10px;
  box-shadow: var(--shadow);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  aspect-ratio: 4 / 3;
  min-height: 180px;
  overflow: hidden;
  position: relative;
  
  opacity: 0;
  transform: translateY(30px);
  transition: opacity 0.5s ease-out, transform 0.5s ease-out, border-color 0.3s ease, box-shadow 0.3s ease, background-color 0.3s ease;
}

.image-card.reveal-visible {
  opacity: 1;
  transform: translateY(0);
}

.image-card:hover {
  border-color: var(--card-hover-border);
  box-shadow: var(--shadow-hover);
  transform: translateY(-4px);
}

.image-card img {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: contain;
  border-radius: 8px;
  transition: transform 0.3s ease;
}

.image-card:hover img {
  transform: scale(1.03);
}

/* Black Box Text Card */
.image-card.text-card {
  background-color: #000000 !important;
  border-color: #222222;
  padding: 1.5rem;
  text-align: center;
  cursor: default;
}

.image-card.text-card:hover {
  border-color: var(--card-hover-border);
}

.card-text {
  color: #ffffff;
  font-family: 'Montserrat', sans-serif;
  font-size: 1.05rem;
  font-weight: 600;
  line-height: 1.4;
  letter-spacing: 0.02em;
  user-select: none;
}

/* Lightbox Modal */
.image-modal {
  display: none;
  position: fixed;
  z-index: 1000;
  left: 0;
  top: 0;
  width: 100%;
  height: 100%;
  background-color: rgba(0, 0, 0, 0.9);
  backdrop-filter: blur(6px);
  justify-content: center;
  align-items: center;
  padding: 20px;
}

.image-modal.active {
  display: flex;
  animation: modalFadeIn 0.25s ease-out;
}

@keyframes modalFadeIn {
  from { opacity: 0; }
  to { opacity: 1; }
}

.modal-content {
  max-width: 92vw;
  max-height: 90vh;
  object-fit: contain;
  border-radius: 10px;
  border: 2px solid rgba(255, 255, 255, 0.1);
  box-shadow: 0 10px 40px rgba(0, 0, 0, 0.8);
}

.modal-close {
  position: absolute;
  top: 20px;
  right: 30px;
  color: #ffffff;
  font-size: 38px;
  font-weight: 300;
  cursor: pointer;
  user-select: none;
  transition: color 0.2s ease;
}

.modal-close:hover {
  color: var(--accent-green);
}

.nav-action-btn {
  width: 100%;
  padding: 1.2rem;
  margin-top: 1rem;
  margin-bottom: 1rem;
  background-color: var(--card-bg);
  border: 2px solid var(--border-color);
  border-radius: 14px;
  color: var(--text-color);
  font-family: 'Montserrat', sans-serif;
  font-size: 1rem;
  font-weight: 600;
  cursor: pointer;
  box-shadow: var(--shadow);
  transition: transform 0.2s ease, box-shadow 0.3s ease, border-color 0.3s ease, background-color 0.3s ease, color 0.3s ease;
  text-decoration: none;
  display: block;
  text-align: center;
}

.nav-action-btn:hover {
  border-color: var(--card-hover-border);
  box-shadow: var(--shadow-hover);
  transform: translateY(-2px);
}

@media (max-width: 600px) {
  body {
    padding: 1.5rem 12px;
  }

  .image-grid {
    grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
    gap: 1rem;
  }

  .theme-toggle-btn {
    position: static;
    margin: 0 auto 1.5rem auto;
  }
}
</style>
</head>
<body>

  <header>

<div id="imageModal" class="image-modal" onclick="closeModal()">
  <span class="modal-close" onclick="closeModal()">&times;</span>
  <img class="modal-content" id="expandedImage" alt="Expanded view">
</div>

<script>
  // Automatically hide card if image file is missing/broken on server
  document.addEventListener('error', (e) => {
    if (e.target.tagName === 'IMG') {
      const card = e.target.closest('.image-card, .hero-image-card');
      if (card && !card.classList.contains('text-card')) {
        card.style.display = 'none';
      }
    }
  }, true);

  // Dark Mode Toggle
  function toggleTheme() {
    const body = document.documentElement;
    const themeText = document.getElementById('theme-text');
    if (body.getAttribute('data-theme') === 'dark') {
      body.removeAttribute('data-theme');
      themeText.textContent = 'Dark Mode';
    } else {
      body.setAttribute('data-theme', 'dark');
      themeText.textContent = 'Light Mode';
    }
  }

  // Modal Expand Functions
  function openModal(imageSrc) {
    if (!imageSrc) return;
    const modal = document.getElementById('imageModal');
    const modalImg = document.getElementById('expandedImage');
    modalImg.src = imageSrc;
    modal.classList.add('active');
  }

  function closeModal() {
    const modal = document.getElementById('imageModal');
    modal.classList.remove('active');
  }

  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') closeModal();
  });

  // Scroll Reveal IntersectionObserver
  document.addEventListener('DOMContentLoaded', () => {
    const revealCards = document.querySelectorAll('.reveal-card');

    if ('IntersectionObserver' in window) {
      const observerOptions = {
        root: null,
        threshold: 0.05,
        rootMargin: '50px 0px'
      };

      const scrollObserver = new IntersectionObserver((entries, observer) => {
        entries.forEach(entry => {
          if (entry.isIntersecting) {
            entry.target.classList.add('reveal-visible');
            observer.unobserve(entry.target);
          }
        });
      }, observerOptions);

      revealCards.forEach(card => scrollObserver.observe(card));
    }

    // Safety timeout ensures all valid cards become visible
    setTimeout(() => {
      revealCards.forEach(card => card.classList.add('reveal-visible'));
    }, 500);
  });
</script>
</body>
